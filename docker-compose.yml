services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentis
      POSTGRES_PASSWORD: agentis
      POSTGRES_DB: agentis
    ports:
      - "15432:5432"
    volumes:
      - agentis_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentis -d agentis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentis_pg:
